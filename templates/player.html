<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ movie.title }} - Reproductor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        body { background-color: #000; color: #fff; }
        .player-container { position: relative; padding-top: 56.25%; background: #111; border-radius: 12px; overflow: hidden; box-shadow: 0 0 30px rgba(0,0,0,0.5); }
        .player-container iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0; }
        .movie-info { margin-top: 30px; padding: 20px; background: #111; border-radius: 12px; }
        .back-btn { margin-bottom: 20px; }
    </style>
</head>
<body>
    <div class="container py-5">
        <a href="/movies" class="btn btn-outline-light back-btn">
            <i class="bi bi-arrow-left"></i> Volver al catálogo
        </a>

        <div class="row">
            <div class="col-lg-9 mx-auto">
                <div class="player-container">
                    <iframe 
                        src="https://vidsrc.xyz/embed/movie/{{ movie.id }}" 
                        allowfullscreen 
                        sandbox="allow-forms allow-pointer-lock allow-same-origin allow-scripts allow-top-navigation"
                        scrolling="no"
                        frameborder="0">
                    </iframe>
                </div>

                <div class="movie-info">
                    <h1 class="display-5 fw-bold">{{ movie.title }}</h1>
                    <div class="d-flex gap-3 mb-3 text-warning">
                        <span>⭐ {{ movie.vote_average }}</span>
                        <span>📅 {{ movie.release_date }}</span>
                    </div>
                    <p class="lead text-light-50">{{ movie.overview }}</p>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
