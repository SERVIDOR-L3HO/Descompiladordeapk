<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>APK Decompiler Pro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        :root {
            --primary-bg: #0f172a;
            --secondary-bg: #1e293b;
            --accent-color: #38bdf8;
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
        }
        body {
            background-color: var(--primary-bg);
            color: var(--text-main);
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
        }
        .navbar {
            background-color: var(--secondary-bg) !important;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .card {
            background-color: var(--secondary-bg);
            border: 1px solid rgba(255,255,255,0.1);
            color: var(--text-main);
            border-radius: 12px;
        }
        .upload-card {
            border: 2px dashed rgba(56, 189, 248, 0.3);
            transition: all 0.3s ease;
            cursor: pointer;
        }
        .upload-card:hover {
            border-color: var(--accent-color);
            background-color: rgba(56, 189, 248, 0.05);
        }
        .btn-primary {
            background-color: var(--accent-color);
            border: none;
            color: #0f172a;
            font-weight: 600;
        }
        .btn-primary:hover {
            background-color: #7dd3fc;
            color: #0f172a;
        }
        .project-item {
            transition: all 0.2s;
        }
        .project-item:hover {
            background-color: rgba(255,255,255,0.05);
        }
        .progress {
            background-color: #334155;
            height: 8px;
        }
        .progress-bar {
            background-color: var(--accent-color);
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark mb-5">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center" href="/">
                <i class="bi bi-box-seam me-2 text-info"></i>
                <span class="fw-bold">APK Decompiler Pro</span>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link active" href="/"><i class="bi bi-house-door me-1"></i> Inicio</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/movies"><i class="bi bi-film me-1"></i> Películas</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="card p-5 mb-5 upload-card text-center" id="dropZone">
                    <input type="file" id="fileInput" accept=".apk" class="d-none">
                    <i class="bi bi-cloud-arrow-up display-1 text-info mb-3"></i>
                    <h2 class="fw-bold">Subir APK</h2>
                    <p class="text-muted">Arrastra tu archivo aquí o haz clic para explorar</p>
                    <button class="btn btn-primary btn-lg mt-3 px-5" onclick="document.getElementById('fileInput').click()">
                        Seleccionar Archivo
                    </button>
                    
                    <div class="mt-4 d-none" id="progressContainer">
                        <div class="progress mb-2">
                            <div class="progress-bar progress-bar-striped progress-bar-animated" id="progressBar" role="progressbar" style="width: 0%"></div>
                        </div>
                        <p class="small text-info" id="statusText">Preparando...</p>
                    </div>
                    <div class="alert alert-danger mt-3 d-none" id="errorAlert"></div>
                </div>

                <h4 class="mb-4 d-flex align-items-center">
                    <i class="bi bi-collection me-2 text-info"></i>
                    Proyectos Recientes
                </h4>
                
                <div class="card">
                    <div class="list-group list-group-flush" id="projectList">
                        {% if projects %}
                            {% for project in projects %}
                            <div class="list-group-item bg-transparent border-opacity-10 border-white d-flex justify-content-between align-items-center p-3 project-item" id="project-{{ project.name }}">
                                <div>
                                    <h6 class="mb-0 text-white">{{ project.name }}</h6>
                                    <small class="text-muted">Descompilado</small>
                                </div>
                                <div class="d-flex gap-2">
                                    <a href="/project/{{ project.name }}" class="btn btn-sm btn-outline-info">
                                        <i class="bi bi-folder2-open"></i> Abrir
                                    </a>
                                    <button class="btn btn-sm btn-outline-danger" onclick="deleteProject('{{ project.name }}')">
                                        <i class="bi bi-trash"></i>
                                    </button>
                                </div>
                            </div>
                            {% endfor %}
                        {% else %}
                            <div class="p-5 text-center text-muted">
                                <i class="bi bi-inbox display-4 d-block mb-3"></i>
                                No hay proyectos todavía
                            </div>
                        {% endif %}
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');
        const progressContainer = document.getElementById('progressContainer');
        const progressBar = document.getElementById('progressBar');
        const statusText = document.getElementById('statusText');
        const errorAlert = document.getElementById('errorAlert');

        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(e => {
            dropZone.addEventListener(e, ev => ev.preventDefault());
        });

        dropZone.addEventListener('dragover', () => dropZone.style.backgroundColor = 'rgba(56, 189, 248, 0.08)');
        dropZone.addEventListener('dragleave', () => dropZone.style.backgroundColor = '');
        
        dropZone.addEventListener('drop', e => {
            dropZone.style.backgroundColor = '';
            const file = e.dataTransfer.files[0];
            if (file && file.name.endsWith('.apk')) uploadFile(file);
            else showError('Solo se aceptan archivos .apk');
        });

        fileInput.addEventListener('change', e => {
            if (e.target.files[0]) uploadFile(e.target.files[0]);
        });

        function uploadFile(file) {
            errorAlert.classList.add('d-none');
            progressContainer.classList.remove('d-none');
            progressBar.style.width = '0%';
            statusText.textContent = 'Subiendo APK...';

            const formData = new FormData();
            formData.append('file', file);

            const xhr = new XMLHttpRequest();
            xhr.upload.onprogress = e => {
                if (e.lengthComputable) {
                    const pct = (e.loaded / e.total) * 40;
                    progressBar.style.width = pct + '%';
                }
            };
            
            xhr.onload = () => {
                if (xhr.status === 200) {
                    const res = JSON.parse(xhr.responseText);
                    progressBar.style.width = '100%';
                    statusText.textContent = '¡Completado!';
                    setTimeout(() => window.location.href = '/project/' + res.project, 800);
                } else {
                    const res = JSON.parse(xhr.responseText);
                    showError(res.error || 'Error en la subida');
                }
            };
            
            xhr.onerror = () => showError('Error de conexión al servidor');
            xhr.open('POST', '/upload');
            xhr.send(formData);

            setTimeout(() => {
                if (parseFloat(progressBar.style.width) < 50) {
                    statusText.textContent = 'Descompilando archivos... (esto puede tardar)';
                    progressBar.style.width = '70%';
                }
            }, 2000);
        }

        function showError(msg) {
            progressContainer.classList.add('d-none');
            errorAlert.textContent = msg;
            errorAlert.classList.remove('d-none');
        }

        function deleteProject(name) {
            if (!confirm('¿Estás seguro de eliminar el proyecto ' + name + '?')) return;
            fetch('/delete/' + name, { method: 'POST' })
                .then(r => r.json())
                .then(res => {
                    if (res.success) document.getElementById('project-' + name).remove();
                    else alert(res.error);
                });
        }
    </script>
</body>
</html>
