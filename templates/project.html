<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ project_name }} - APK Decompiler</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #1a1a2e; color: #eee; min-height: 100vh; display: flex; }
        .sidebar { width: 320px; background: #16213e; height: 100vh; overflow-y: auto; border-right: 1px solid #333; position: fixed; }
        .sidebar-header { padding: 20px; border-bottom: 1px solid #333; }
        .sidebar-header a { color: #888; text-decoration: none; font-size: 0.9rem; }
        .sidebar-header a:hover { color: #00d9ff; }
        .sidebar-header h2 { color: #00d9ff; margin-top: 10px; word-break: break-all; }
        .tree { padding: 10px; }
        .tree-item { padding: 6px 10px; cursor: pointer; border-radius: 6px; display: flex; align-items: center; gap: 8px; }
        .tree-item:hover { background: #1a2744; }
        .tree-item.active { background: #00d9ff22; color: #00d9ff; }
        .tree-folder { font-weight: 500; }
        .tree-folder::before { content: '📁'; }
        .tree-folder.open::before { content: '📂'; }
        .tree-file::before { content: '📄'; }
        .tree-file.xml::before { content: '📜'; }
        .tree-file.smali::before { content: '💻'; }
        .tree-file.png::before, .tree-file.jpg::before { content: '🖼️'; }
        .tree-children { margin-left: 20px; display: none; }
        .tree-children.open { display: block; }
        .main { margin-left: 320px; flex: 1; padding: 20px; }
        .file-viewer { background: #16213e; border-radius: 12px; min-height: calc(100vh - 40px); }
        .file-header { padding: 15px 20px; border-bottom: 1px solid #333; display: flex; justify-content: space-between; align-items: center; }
        .file-name { color: #00d9ff; font-size: 1.1rem; }
        .download-btn { background: #00d9ff; color: #000; padding: 8px 16px; border: none; border-radius: 6px; cursor: pointer; text-decoration: none; font-size: 0.9rem; }
        .file-content { padding: 20px; overflow-x: auto; }
        .file-content pre { background: #0d1117; padding: 20px; border-radius: 8px; overflow-x: auto; font-family: 'Monaco', 'Menlo', monospace; font-size: 13px; line-height: 1.5; color: #c9d1d9; }
        .placeholder { text-align: center; padding: 100px 20px; color: #666; }
        .binary-msg { text-align: center; padding: 60px; color: #888; }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="sidebar-header">
            <a href="/">← Volver</a>
            <h2>{{ project_name }}</h2>
        </div>
        <div class="tree" id="tree"></div>
    </div>
    
    <div class="main">
        <div class="file-viewer">
            <div class="file-header" id="fileHeader" style="display: none;">
                <span class="file-name" id="fileName"></span>
                <a class="download-btn" id="downloadBtn" href="#">Descargar</a>
            </div>
            <div class="file-content" id="fileContent">
                <div class="placeholder">Selecciona un archivo para ver su contenido</div>
            </div>
        </div>
    </div>

    <script>
        const projectName = "{{ project_name }}";
        const tree = {{ tree | tojson }};

        function renderTree(items, container) {
            items.forEach(item => {
                const div = document.createElement('div');
                if (item.type === 'folder') {
                    div.innerHTML = `<div class="tree-item tree-folder" data-path="${item.path}">${item.name}</div>`;
                    const children = document.createElement('div');
                    children.className = 'tree-children';
                    if (item.children) renderTree(item.children, children);
                    div.appendChild(children);
                    div.querySelector('.tree-folder').onclick = function() {
                        this.classList.toggle('open');
                        children.classList.toggle('open');
                    };
                } else {
                    const ext = item.name.split('.').pop();
                    div.innerHTML = `<div class="tree-item tree-file ${ext}" data-path="${item.path}">${item.name}</div>`;
                    div.querySelector('.tree-file').onclick = () => loadFile(item.path, item.name);
                }
                container.appendChild(div);
            });
        }

        function loadFile(path, name) {
            document.querySelectorAll('.tree-item').forEach(el => el.classList.remove('active'));
            event.target.classList.add('active');
            
            fetch(`/file/${projectName}/${path}`)
                .then(r => r.json())
                .then(data => {
                    document.getElementById('fileHeader').style.display = 'flex';
                    document.getElementById('fileName').textContent = data.filename;
                    document.getElementById('downloadBtn').href = `/download/${projectName}/${path}`;
                    
                    if (data.type === 'text') {
                        document.getElementById('fileContent').innerHTML = 
                            `<pre>${escapeHtml(data.content)}</pre>`;
                    } else {
                        document.getElementById('fileContent').innerHTML = 
                            `<div class="binary-msg">Archivo binario - usa el boton Descargar</div>`;
                    }
                });
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        renderTree(tree, document.getElementById('tree'));
    </script>
</body>
</html>
